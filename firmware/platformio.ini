; ============================================================================
;  Corvid -- TIER 1 firmware  (STM32F405 flight controller)  --  PlatformIO
;  Board : Adafruit Feather STM32F405 Express (#4382)
;  Core  : STM32duino (Arduino framework for STM32)
;  See ARCHITECTURE.md for the full design.
; ============================================================================

[platformio]
default_envs = feather_f405

[env:feather_f405]
platform  = ststm32@20.0.0
board     = adafruit_feather_f405
framework = arduino
build_src_filter = +<*> -<motor_bench_main.cpp> -<pwm_diagnostic_main.cpp> -<esc_pwm.cpp> -<dshot_diagnostic_main.cpp> -<dshot_output.cpp> -<dshot_imu_main.cpp>

; Standard PlatformIO layout: sources in src/, headers in include/ (which is on
; the compiler include path automatically), host tests in test/. main.cpp pulls
; in "board.h" / "imu.h" / "rate_timer.h" / "pid.h" by bare name -- all resolve
; from include/. (Replaces the old per-module imu/ + pid/ lib_extra_dirs setup.)

; ---- Upload / monitor -------------------------------------------------------
; Enter ROM DFU with BOOT0 tied to 3.3V, then reset. See MOTOR_CONTROL.md
; for power and RX wiring precautions. ST-Link is an alternative.
upload_protocol = dfu
monitor_speed   = 115200

; USB CDC serial (so `Serial` prints appear over the native USB-C port).
build_flags =
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; ---- Libraries --------------------------------------------------------------
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit NeoPixel @ ^1.12.3

; ============================================================================
;  Native host test environment  --  runs the Unity suites in test/ on the PC
;  (no hardware needed).  Run with:   pio test -e native
;  Only exercises hardware-independent, header-only modules (e.g. RateTimer);
;  it deliberately does not build the Arduino firmware.
; ============================================================================
[env:native]
platform    = native
test_framework = unity
build_flags = -I include
build_src_filter = -<*>   ; don't compile the Arduino firmware for host tests

; Compile the ramp tests with the v6 identity/capability as well as the native
; default's v5 identity. These tests never communicate with hardware.
[env:native_ramp]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -D CORVIDIA_DSHOT_RAMP_MS=5000
test_filter = test_dshot_ramp

; Separate motor test image; output interlock defaults to OFF in esc_pwm.h.
; See MOTOR_CONTROL.md before enabling CORVIDIA_BENCH_OUTPUTS=1.
[env:feather_f405_bench]
extends = env:feather_f405
build_src_filter = -<*> +<motor_bench_main.cpp> +<esc_pwm.cpp>
lib_deps =

; Explicit props-off PWM test build AFTER wiring/ESC configuration checks.
; Never selected by default. No flight controller or autonomous arming.
[env:feather_f405_bench_pwm]
extends = env:feather_f405_bench
build_flags =
    ${env:feather_f405.build_flags}
    -D CORVIDIA_BENCH_OUTPUTS=1

; GPIO-pad measurement only. ESC BATTERY MUST STAY DISCONNECTED.
; No incoming commands are executed. All four outputs remain nominal 1000 us.
[env:feather_f405_pwm_diagnostic]
extends = env:feather_f405_bench_pwm
build_src_filter = -<*> +<pwm_diagnostic_main.cpp> +<esc_pwm.cpp>

; DShot300 preparation: default interlock holds all signal pads low.
[env:feather_f405_dshot_diagnostic]
extends = env:feather_f405_bench
build_src_filter = -<*> +<dshot_diagnostic_main.cpp> +<dshot_output.cpp>

; Unpowered signal-validation image: digital zero-throttle frames only.
; No nonzero throttle API or motor-test handler exists in this image.
[env:feather_f405_dshot_signal]
extends = env:feather_f405_dshot_diagnostic
build_flags =
    ${env:feather_f405.build_flags}
    -D CORVIDIA_DSHOT_SIGNALS=1

; Integrated IMU + MAVLink commands; hardware signals disabled by default.
[env:feather_f405_dshot_imu]
extends = env:feather_f405
build_src_filter = -<*> +<dshot_imu_main.cpp> +<dshot_output.cpp> +<imu.cpp>
build_flags =
    ${env:feather_f405.build_flags}
    -D CORVIDIA_DSHOT_BOUNDED=1

; Unpowered validation with IMU active. Motor commands remain disabled.
[env:feather_f405_dshot_imu_signal]
extends = env:feather_f405_dshot_imu
build_flags =
    ${env:feather_f405_dshot_imu.build_flags}
    -D CORVIDIA_DSHOT_SIGNALS=1

; Operator bench v5: default envelope 5%/500 ms, explicit envelope up to
; 100%/60000 ms. Initial v5 all-four pulses at 5% and 7.5%/1000 ms passed.
; Not a flight controller; see DSHOT_V5.md before commissioning.
[env:feather_f405_dshot_imu_bench]
extends = env:feather_f405_dshot_imu_signal
build_flags =
    ${env:feather_f405_dshot_imu_signal.build_flags}
    -D CORVIDIA_DSHOT_MOTOR_TESTS=1

; v6 bench profile: fixed five-second startup ramp on every accepted test.
; Existing v5 profiles above retain immediate output. Stop is always immediate;
; the ramp is included in the requested duration and cannot extend it.
[env:feather_f405_dshot_imu_ramp]
extends = env:feather_f405_dshot_imu_bench
build_flags =
    ${env:feather_f405_dshot_imu_bench.build_flags}
    -D CORVIDIA_DSHOT_RAMP_MS=5000
